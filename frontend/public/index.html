<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=2" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="We read 110,000+ live job postings from 3,300+ high-growth companies to show what's rising, what's declining, and which skills are suddenly in demand."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Canonical host is www (matches the server-rendered /r/ pages + sitemap).
         Ensure Vercel 301-redirects the non-www apex to www. -->
    <link rel="canonical" href="https://www.whatsindemand.com/" />

    <title>WhatsInDemand — Real hiring data from 110,000+ job postings</title>

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WhatsInDemand" />
    <meta property="og:title" content="WhatsInDemand — Real hiring trends. This week." />
    <meta property="og:description" content="We read 110,000+ live job postings from 3,300+ high-growth companies to show what's rising, what's declining, and which skills are suddenly in demand." />
    <meta property="og:url" content="https://www.whatsindemand.com/" />
    <meta property="og:image" content="https://www.whatsindemand.com/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WhatsInDemand — Real hiring trends. This week." />
    <meta name="twitter:description" content="We read 110,000+ live job postings from 3,300+ high-growth companies to show what's rising, what's declining, and which skills are suddenly in demand." />
    <meta name="twitter:image" content="https://www.whatsindemand.com/og-image.png?v=3" />

    <!-- Roboto (used by Google sign-in button to match brand guidelines) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet" />

    <!-- Structured data: Organization + WebSite (helps brand knowledge panel) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.whatsindemand.com/#org",
          "name": "WhatsInDemand",
          "url": "https://www.whatsindemand.com/",
          "logo": "https://www.whatsindemand.com/logo512.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.whatsindemand.com/#site",
          "name": "WhatsInDemand",
          "url": "https://www.whatsindemand.com/",
          "publisher": { "@id": "https://www.whatsindemand.com/#org" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>
      <!-- Crawlable fallback for non-JS clients (AI answer engines: GPTBot,
           PerplexityBot, ClaudeBot, etc.). Real users with JS see the React app;
           this block gives crawlers real content + internal links to the
           server-rendered /r/ role pages. -->
      <main>
        <h1>WhatsInDemand — real hiring trends from live job postings</h1>
        <p>
          We read 110,000+ live job postings from 3,300+ high-growth companies to
          show what's rising, what's declining, and which skills are suddenly in
          demand. Data is refreshed weekly and free to explore.
        </p>
        <h2>Most-tracked roles</h2>
        <ul>
          <li><a href="/r/software-engineer">Software Engineer — skills in demand</a></li>
          <li><a href="/r/product-manager">Product Manager — skills in demand</a></li>
          <li><a href="/r/data-scientist">Data Scientist — skills in demand</a></li>
          <li><a href="/r/operations-manager">Operations Manager — skills in demand</a></li>
          <li><a href="/r/account-executive">Account Executive — skills in demand</a></li>
          <li><a href="/r/marketing-manager">Marketing Manager — skills in demand</a></li>
          <li><a href="/r/business-analyst">Business Analyst — skills in demand</a></li>
          <li><a href="/r/engineering-manager">Engineering Manager — skills in demand</a></li>
        </ul>
        <p>
          <a href="/r/">Browse all tracked roles</a> &middot;
          <a href="/blog">Read the WhatsInDemand blog</a>
        </p>
      </main>
      <p>You need to enable JavaScript to run the interactive dashboard.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
