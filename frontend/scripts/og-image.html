<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WhatsInDemand OG card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #050505; }

  /* The card is pinned to the top-left at exactly 1200x630 so it can be
     screenshotted precisely. Regenerate the OG image by opening this file
     in Chrome and capturing the [0,0 → 1200,630] region. */
  .card {
    position: fixed;
    top: 0; left: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 88% 118%, rgba(74,222,128,0.22), transparent 60%),
      radial-gradient(700px 480px at -6% -12%, rgba(74,222,128,0.07), transparent 55%),
      #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    color: #fafafa;
    display: flex;
    padding: 62px 72px 58px;
  }

  /* faint dotted texture for depth */
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(120deg, #000 20%, transparent 75%);
    -webkit-mask-image: linear-gradient(120deg, #000 20%, transparent 75%);
  }
  /* top hairline glow */
  .card::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(74,222,128,0.6), transparent);
  }

  .left { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; width: 640px; }

  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    align-self: flex-start;
    padding: 8px 16px;
    border: 1px solid rgba(74,222,128,0.35);
    background: rgba(74,222,128,0.08);
    border-radius: 999px;
    font-size: 15px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #7ff0a8;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 12px 2px rgba(74,222,128,0.9);
  }

  h1 {
    margin-top: 28px;
    font-size: 86px; font-weight: 800; line-height: 0.98;
    letter-spacing: -0.045em;
  }
  h1 .hype { color: #4ade80; text-shadow: 0 0 42px rgba(74,222,128,0.45); }

  .sub {
    margin-top: 24px;
    font-size: 24px; font-weight: 500; line-height: 1.34;
    color: rgba(255,255,255,0.66); max-width: 566px; letter-spacing: -0.01em;
  }
  .sub b { color: #fafafa; font-weight: 700; }

  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; }
  .mark {
    display: flex; align-items: baseline; gap: 3px;
    font-size: 27px; font-weight: 800; letter-spacing: -0.02em;
  }
  .mark .in { color: #4ade80; }
  .foot .meta { font-size: 17px; color: rgba(255,255,255,0.4); font-weight: 500; }
  .foot .bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
  .foot .bars i { width: 4px; border-radius: 2px; background: #4ade80; display: block; }

  /* ── right: dramatic rising chart ── */
  .right { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; }
  svg { overflow: visible; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <span class="pill"><span class="dot"></span>Live job-market data</span>
      <h1>Real hiring data.<br /><span class="hype">No hype.</span></h1>
      <p class="sub">We read <b>100,000+ live job postings</b> from <b>3,300+ companies</b> — what's rising, what's cooling, what's suddenly in demand.</p>
      <div class="foot">
        <span class="mark">Whats<span class="in">In</span>Demand</span>
        <span class="foot bars" aria-hidden="true">
          <i style="height:8px"></i><i style="height:13px"></i><i style="height:10px"></i><i style="height:17px"></i><i style="height:22px"></i>
        </span>
        <span class="meta">· updated weekly</span>
      </div>
    </div>

    <div class="right">
      <svg width="360" height="330" viewBox="0 0 360 330" fill="none">
        <defs>
          <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#4ade80" stop-opacity="0.15"/>
            <stop offset="1" stop-color="#4ade80" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="gr" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#f87171" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#f87171" stop-opacity="0.7"/>
          </linearGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- bars: two red (cooling) then rising green -->
        <g>
          <rect x="6"   y="210" width="40" height="110" rx="7" fill="url(#gr)"/>
          <rect x="58"  y="240" width="40" height="80"  rx="7" fill="url(#gr)"/>
          <rect x="110" y="180" width="40" height="140" rx="7" fill="url(#g)"/>
          <rect x="162" y="132" width="40" height="188" rx="7" fill="url(#g)"/>
          <rect x="214" y="84"  width="40" height="236" rx="7" fill="url(#g)"/>
          <rect x="266" y="34"  width="40" height="286" rx="7" fill="url(#g)"/>
        </g>

        <!-- rising trend line + arrowhead, glowing -->
        <g filter="url(#glow)">
          <polyline points="26,232 78,262 130,200 182,152 234,104 286,54"
                    stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M286 54 L262 60 M286 54 L280 78" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
          <circle cx="286" cy="54" r="9" fill="#4ade80"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
